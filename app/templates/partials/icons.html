{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "grid" -%}
<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == "compass" -%}
<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>
{%- elif name == "wallet" -%}
<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H19v14H6.5A2.5 2.5 0 0 1 4 16.5v-9Z"/><path d="M4 8h15"/><circle cx="16.5" cy="13.5" r="1"/>
{%- elif name == "compare" -%}
<path d="M7 4v16M17 4v16"/><path d="m3.5 8 3.5-4 3.5 4M13.5 16l3.5 4 3.5-4"/>
{%- elif name == "layers" -%}
<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/>
{%- elif name == "flask" -%}
<path d="M9 3h6M10 3v6.5L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9.5V3"/><path d="M7.5 15h9"/>
{%- elif name == "pulse" -%}
<path d="M3 12h4l2-6 4 12 2-6h6"/>
{%- elif name == "signal" -%}
<path d="M4 20V10M9 20V6M14 20V13M19 20V4"/>
{%- elif name == "plus" -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == "refresh" -%}
<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
{%- elif name == "play" -%}
<path d="m8 5 11 7-11 7V5Z"/>
{%- elif name == "search" -%}
<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
{%- elif name == "target" -%}
<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>
{%- elif name == "external" -%}
<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
{%- elif name == "check" -%}
<path d="m5 12 4 4L19 6"/>
{%- elif name == "alert" -%}
<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17h.01"/>
{%- elif name == "database" -%}
<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5V18c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
{%- elif name == "download" -%}
<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "menu" -%}
<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == "spark" -%}
<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>
{%- elif name == "shield" -%}
<path d="M12 3 5 6v6c0 4.4 3 8 7 9 4-1 7-4.6 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>
{%- elif name == "arrow-left" -%}
<path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif name == "chevron-down" -%}
<path d="m6 9 6 6 6-6"/>
{%- else -%}
<circle cx="12" cy="12" r="8"/>
{%- endif -%}
</svg>
{%- endmacro %}
