services:
  polytrader-lab:
    build: .
    container_name: polytrader-lab
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - lab_data:/app/data
      # Optional: mount the pre-built 1-second kline dataset read-only.
      # - /home/ubuntu/polymarket_data/dataset:/data/klines:ro
    env_file:
      - path: .env
        required: false
    environment:
      - LAB_DATA_DIR=/app/data
      - LAB_DB_PATH=/app/data/lab.sqlite
      # - LAB_KLINES_DATASET_DIR=/data/klines
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

volumes:
  lab_data:
    driver: local
